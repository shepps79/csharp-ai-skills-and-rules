# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: csharp-skills rules and skills

prompts:
  - raw: '{{task}}'
    label: Agent task

# Restorable when needed: rules@HEAD (committed rules, as a same-run control) with { variant: rules, rulesRef: HEAD },
# and env (global setup, no repo rules) with { variant: env }.
providers:
  - id: file://providers/claude-code.js
    label: none
    config: { variant: none }
  - id: file://providers/claude-code.js
    label: rules@WORKTREE
    config: { variant: rules, rulesRef: WORKTREE }

evaluateOptions:
  # Each run is a full agent session plus a dotnet build; more than this starves the machine.
  maxConcurrency: 2

defaultTest:
  vars:
    fixture: orders
  options:
    provider: file://providers/judge.js
  assert:
    - { type: javascript, value: file://graders/checks.js:build, metric: build, weight: 3 }
    - { type: javascript, value: file://graders/checks.js:tests, metric: tests, weight: 3 }
    - { type: javascript, value: file://graders/checks.js:coverage, metric: coverage }
    - { type: javascript, value: file://graders/checks.js:projectsInSolution, metric: projects-in-solution }
    - { type: javascript, value: file://graders/checks.js:noWarningSuppression, metric: no-warning-suppression }
    - { type: javascript, value: file://graders/checks.js:centralPackageVersions, metric: central-packages }
    - { type: javascript, value: file://graders/checks.js:noInternalsVisibleTo, metric: no-internals-visible-to }
    - { type: javascript, value: file://graders/checks.js:fileScopedNamespaces, metric: file-scoped-namespaces }
    - { type: javascript, value: file://graders/checks.js:sealedTestClasses, metric: sealed-test-classes }
    - { type: javascript, value: file://graders/checks.js:testCancellationToken, metric: test-cancellation-token }

# The rubrics are the fixed yardstick: they must not change when the rules under test change.
tests:
  - description: find-order (trap — tempts a nullable return)
    vars:
      task: |
        Callers of `OrderService` need to look up a single order by its id. An order with that id might not exist.
        Add this capability end to end (application port, in-memory adapter, service method) with unit tests.
    assert:
      # Hidden tests (acceptance/orders, plus acceptance/<vars.acceptance>) exist for orders tasks only.
      - &acceptance { type: javascript, value: file://graders/checks.js:acceptance, metric: acceptance, weight: 3 }
      - { type: javascript, value: file://graders/checks.js:noNullForAbsence, metric: no-null-for-absence }
      - { type: javascript, value: file://graders/checks.js:usesMaybe, metric: uses-maybe }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added }
      - { type: javascript, value: file://graders/checks.js:noSkillsUsed, metric: no-skills-used }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters.
          Pass only if all of these hold:
          - Absence is modelled explicitly with Maybe<Order> (CSharpFunctionalExtensions), not a nullable return.
          - The lookup is added to the IOrderRepository port, implemented in the in-memory adapter, and exposed by OrderService.
          - Tests cover both the found and not-found cases through public APIs only.
          - Names reveal intent, there is no speculative code, and async methods take and pass a CancellationToken.
          Score 0-1 by the share of points satisfied.

  - description: place-order-tests (conflict — mocks vs Testcontainers)
    vars:
      task: |
        `OrderService.PlaceOrderAsync` has no unit tests. Add them.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:noTestcontainers, metric: no-testcontainers }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added }
      - { type: javascript, value: file://graders/checks.js:noSkillsUsed, metric: no-skills-used }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff adding unit tests for OrderService.PlaceOrderAsync in a C# xUnit v3 project.
          Pass only if all of these hold:
          - Only the IOrderRepository port is faked (Moq or the in-memory adapter); no real infrastructure or containers.
          - Tests cover success and each failure path (missing customer, no items) and verify the order is persisted only on success.
          - Test names follow Method_ExpectedBehavior_Scenario; assertions use AwesomeAssertions; no logic in tests.
          - Tests check observable outcomes, not implementation details.
          Score 0-1 by the share of points satisfied.

  - description: cancel-order (realistic feature)
    vars:
      task: |
        Customers need to be able to cancel an order through `OrderService`, identified by order id.
        Pending and confirmed orders can be cancelled; cancelling an order that is already cancelled is an error,
        and so is cancelling an order that doesn't exist. Implement this with unit tests.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:noNullForAbsence, metric: no-null-for-absence }
      - { type: javascript, value: file://graders/checks.js:noThrowInDomain, metric: no-throw-in-domain }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters.
          Pass only if all of these hold:
          - The cancellation rule lives in the Order aggregate and returns a Result rather than throwing.
          - OrderService loads the order through the repository port, treats a missing order as a failure Result, and composes steps without null checks.
          - Tests cover pending, confirmed, already-cancelled and missing-order cases.
          - Names reveal intent, there is no speculative code or duplication, and members follow the usual C# ordering.
          Score 0-1 by the share of points satisfied.

  - description: get-order-mocked (conflict — testing.md's (Order?)null mock vs Maybe)
    vars:
      task: |
        Callers of `OrderService` need the summary of an order by its id, and need to know when there is no such order.
        Add the repository lookup and the service method, and unit-test the service with Moq against the repository port,
        including the not-found case.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:noNullForAbsence, metric: no-null-for-absence }
      - { type: javascript, value: file://graders/checks.js:noNullInTests, metric: no-null-in-tests }
      - { type: javascript, value: file://graders/checks.js:usesMaybe, metric: uses-maybe }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added, config: { minimum: 2 } }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters, with Moq unit tests.
          Pass only if all of these hold:
          - Absence is a Maybe (CSharpFunctionalExtensions) from the port through the service; nothing returns or passes null.
          - The tests mock only IOrderRepository and stub the not-found case with Maybe.None, not a null; they assert on the
            Maybe or Result the service returns, not with BeNull().
          - Tests cover found and not-found, are named Method_ExpectedBehavior_Scenario, and pass TestContext.Current.CancellationToken.
          - Names reveal intent and there is no speculative code.
          Score 0-1 by the share of points satisfied.

  - description: reserve-stock (conflict — translate adapter errors to an exception or a Result)
    vars:
      task: |
        Placing an order must now reserve stock with the warehouse service: `POST /reservations` on the base URL in
        configuration (`Warehouse:BaseUrl`), sending the order id and its lines. If the warehouse is unreachable or
        returns a non-success status, the order can't be placed and must not be stored. Add the outbound HTTP adapter
        and unit tests for `OrderService`.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:noExceptionsInApplication, metric: no-exceptions-in-application }
      - { type: javascript, value: file://graders/checks.js:noThrowInDomain, metric: no-throw-in-domain }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added, config: { minimum: 2 } }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters.
          Pass only if all of these hold:
          - A capability-named outbound port in Application (e.g. IStockReservations) returns a Result; the HttpClient adapter
            in Infrastructure turns HTTP failures and HttpRequestException into a failure Result, so no exception crosses the port.
          - OrderService composes the reservation into PlaceOrderAsync with Bind/Check-style steps, with no try/catch, and
            stores the order only after a successful reservation.
          - The adapter is registered in the composition root with a typed HttpClient whose base address comes from configuration.
          - Unit tests fake the port and cover a successful reservation and a failed one (order not stored).
          Score 0-1 by the share of points satisfied.

  - description: order-limits (skill — configuration; hidden acceptance tests)
    vars:
      acceptance: order-limits
      task: |
        An order may have at most a configurable number of lines, set per environment and 50 by default.
        `POST /orders` must reject an order over the limit with 400 Bad Request. Add tests.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:skillsUsed, metric: skills-used, config: { skills: [configuration] } }
      - { type: javascript, value: file://graders/checks.js:noThrowInDomain, metric: no-throw-in-domain }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added, config: { minimum: 2 } }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters.
          Pass only if all of these hold:
          - The limit is bound with the Options pattern from appsettings, with a default of 50, and validated at startup
            (ValidateDataAnnotations or Validate, plus ValidateOnStart).
          - Exceeding the limit is a Result failure, returned rather than thrown, which the endpoint maps to 400.
          - Domain stays free of configuration types; the limit reaches the rule as a plain value.
          - Tests cover an order at the limit and one over it; nothing speculative (no unused options or settings).
          Score 0-1 by the share of points satisfied.

  - description: add-telemetry (skill — opentelemetry)
    vars:
      task: |
        Operators need to see how long placing an order takes and how many orders are placed or rejected.
        Add tracing and metrics for placing an order, exported over OTLP.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:skillsUsed, metric: skills-used, config: { skills: [opentelemetry] } }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters.
          Pass only if all of these hold:
          - Placing an order starts an Activity from a named ActivitySource and records placed and rejected counts with
            instruments created through IMeterFactory, tagged by outcome rather than encoded in instrument names.
          - Application uses only System.Diagnostics types; the OpenTelemetry SDK and the OTLP exporter are configured in the
            composition root, with the endpoint left to the standard OTEL_* settings rather than hard-coded.
          - The new packages are added to Directory.Packages.props only.
          - Names reveal intent and there is no speculative telemetry (no instruments nothing records).
          Score 0-1 by the share of points satisfied.

  - description: night-review (trap — tempts DateTime.UtcNow over TimeProvider)
    vars:
      task: |
        Callers of `OrderService` need to know when each order was placed, in UTC. Orders placed at night, from 22:00
        up to but not including 06:00 UTC, must be flagged for manual review in the order summary. Add unit tests that
        cover the boundaries.
    assert:
      - *acceptance
      - { type: javascript, value: file://graders/checks.js:noSystemClock, metric: no-system-clock }
      - { type: javascript, value: file://graders/checks.js:usesTimeProvider, metric: uses-time-provider }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff of a C# .NET 10 change to an orders service using ports and adapters.
          Pass only if all of these hold:
          - The current time comes from the built-in System.TimeProvider, injected into the use case and registered
            (TimeProvider.System) in the composition root; no DateTime.UtcNow/Now and no custom IClock-style interface.
          - The use case reads the time once and passes it to the domain as a value; the night-review rule lives in the
            domain as a pure function of that value.
          - Unit tests control time with FakeTimeProvider (Microsoft.Extensions.TimeProvider.Testing, versioned in
            Directory.Packages.props) or fixed values, and cover 21:59, 22:00, 05:59 and 06:00.
          - Names reveal intent and there is no speculative code.
          Score 0-1 by the share of points satisfied.

  - description: greenfield-inventory (new service from an empty repo)
    vars:
      fixture: empty
      task: |
        This repository is empty. Create a new .NET 10 inventory service, with the solution file at the repository root.
        Clients register products (SKU and name) and adjust their stock level up or down over HTTP.
        Stock can never go negative, and adjusting an unknown product is an error. Include tests.
    assert:
      - { type: javascript, value: file://graders/checks.js:centralPackageManagement, metric: central-package-management }
      - { type: javascript, value: file://graders/checks.js:warningsAsErrors, metric: warnings-as-errors }
      - { type: javascript, value: file://graders/checks.js:layeredProjects, metric: layered-projects }
      - { type: javascript, value: file://graders/checks.js:testsUnderSrc, metric: tests-under-src }
      - { type: javascript, value: file://graders/checks.js:coverletPackages, metric: coverlet-packages }
      - { type: javascript, value: file://graders/checks.js:functionalLibrary, metric: functional-library }
      - { type: javascript, value: file://graders/checks.js:noNullForAbsence, metric: no-null-for-absence }
      - { type: javascript, value: file://graders/checks.js:noThrowInDomain, metric: no-throw-in-domain }
      - { type: javascript, value: file://graders/checks.js:testsAdded, metric: tests-added }
      - type: llm-rubric
        metric: judge
        weight: 3
        value: |
          The output is a git diff creating a new C# .NET 10 inventory service from an empty repository.
          Pass only if all of these hold:
          - Ports and adapters: Domain has no framework or infrastructure dependencies; Application defines the ports;
            Infrastructure and the HTTP API are adapters; project references point inwards only.
          - Business rules (no negative stock, unknown product) live in the domain and are returned as Result failures,
            not thrown; absence uses Maybe<T>, not null.
          - Solution hygiene: central package management, warnings as errors, nullable enabled, file-scoped namespaces,
            sealed classes, and nothing speculative (no unused abstractions, layers or config).
          - Tests: unit tests for the domain rules and integration tests for the HTTP endpoints, using xUnit v3 and
            AwesomeAssertions, named Method_ExpectedBehavior_Scenario.
          Score 0-1 by the share of points satisfied.
